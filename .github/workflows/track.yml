name: Shoe Discount Tracker

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tracker.py"
      - "requirements.txt"
      - ".github/workflows/track.yml"

permissions:
  contents: write

concurrency:
  group: shoe-alert-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_TELEGRAM: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python tracker.py

      - name: Save state back to repo
        run: |
          git config user.name "shoe-alert-bot"
          git config user.email "actions@github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "update shoe tracker state [skip ci]"
            git push
          fi
